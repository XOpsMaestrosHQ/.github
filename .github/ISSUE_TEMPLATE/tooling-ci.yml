name: Tooling or CI
description: Report a repository tooling, hook, or CI issue.
title: "chore: "
labels: ["tooling", "ci"]
body:
  - type: textarea
    id: issue
    attributes:
      label: Issue
      description: Describe the tooling or CI problem.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Paste redacted terminal or CI output.
      render: text
    validations:
      required: false
